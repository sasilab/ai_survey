<style>
/* ── reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;
  --surface: #fdf5fa;
  --border: #e8e0e8;
  --text: #0f0f0f;
  --muted: #737373;
  --accent: #e8186d;
  --accent-light: #fce8f3;
  --accent-inv: #ffffff;
  --blue-dot: #3b7bd4;
  --danger: #c0392b;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --tamil-font: 'Noto Sans Tamil', 'Latha', 'Tamil MN', sans-serif;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ── progress bar ── */
#progress-bar {
  position: fixed; top: 0; left: 0;
  height: 3px; width: 100%; background: var(--accent);
  transform: scaleX(0); transform-origin: left center;
  transition: transform .4s ease; z-index: 101;
  border-radius: 0 2px 2px 0;
  will-change: transform;
}

/* ── top bar ── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px 0;
  z-index: 99;
  pointer-events: none;
}
#q-counter { font-size: 12px; color: var(--muted); pointer-events: none; }
#lang-switcher {
  display: flex; gap: 6px; pointer-events: all; flex-shrink: 0;
}
.lang-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 6px 14px; border-radius: 20px; font-size: 13px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--muted); cursor: pointer; white-space: nowrap;
  transition: all .15s; font-family: var(--font);
}
.lang-btn.active {
  background: var(--accent); color: var(--accent-inv);
  border-color: var(--accent);
}
.lang-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

/* ── main stage ── */
#stage {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 72px 24px 80px;
  overflow: hidden;
}

/* ── slide ── */
.slide {
  position: absolute;
  width: 100%; max-width: 640px;
  max-height: calc(100vh - 96px); overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  opacity: 0; pointer-events: none;
  transform: translateY(24px);
  transition: opacity .28s ease, transform .28s ease;
  will-change: transform, opacity;
}
.slide.active {
  opacity: 1; pointer-events: all;
  transform: translateY(0);
}
.slide.exit-up   { opacity: 0; transform: translateY(-28px); }
.slide.exit-down { opacity: 0; transform: translateY(28px); }

/* ── section label ── */
.sec-label {
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px;
}

/* ── question text ── */
.q-text {
  font-size: clamp(20px, 4vw, 27px);
  font-weight: 600; line-height: 1.38;
  color: var(--text); margin-bottom: 8px;
}
.q-sub {
  font-size: 14px; color: var(--muted);
  line-height: 1.6; margin-bottom: 24px;
}
.q-text.ta, .q-sub.ta, .opt-label.ta {
  font-family: var(--tamil-font);
}

/* ── informed-consent disclosure box (long, scrollable) ── */
.consent-heading {
  font-size: 16px; font-weight: 600; line-height: 1.45; margin-bottom: 12px;
}
.consent-box {
  max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px 16px; background: var(--surface);
  /* subtle inner shadow at the bottom hints that there's more to scroll */
  box-shadow: inset 0 -16px 14px -14px rgba(0,0,0,0.22);
}
.consent-list { margin: 0; padding-left: 20px; }
.consent-list li {
  font-size: 14px; font-weight: 400; line-height: 1.6;
  color: var(--text); margin-bottom: 10px;
}
.consent-list li:last-child { margin-bottom: 0; }

/* ── options ── */
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; min-height: 48px; border-radius: var(--radius);
  border: 1.5px solid var(--border); background: var(--bg);
  cursor: pointer; transition: border-color .14s, background-color .14s, color .14s;
  font-size: 15px; color: var(--text); text-align: left;
  width: 100%; font-family: var(--font);
}
.opt.ta { font-family: var(--tamil-font); font-size: 14px; }
.opt:hover { border-color: var(--accent); background: var(--accent-light); }
.opt.selected {
  border-color: var(--accent);
  background: var(--accent);
  color: #ffffff;
}
.opt-circle {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid currentColor; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .14s;
}
.opt-sq {
  width: 18px; height: 18px; border-radius: 4px;
  border: 2px solid currentColor; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.opt.selected .opt-circle {
  border-color: rgba(255,255,255,0.85);
}
.opt.selected .opt-circle::after {
  content: ''; width: 7px; height: 7px;
  border-radius: 50%; background: #ffffff;
}
.opt.selected .opt-sq {
  border-color: rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.2);
}
.opt.selected .opt-sq::after {
  content: '✓'; font-size: 11px; line-height: 1; color: #ffffff;
}
.opt-label { flex: 1; min-width: 0; line-height: 1.45; overflow-wrap: break-word; word-break: break-word; }

/* "Other" free-text input that lives inside an .opt row */
.other-input {
  flex: 1; min-width: 0; border: none; background: transparent; outline: none;
  font-size: 16px; font-family: var(--font); color: inherit;
}
.other-input::placeholder { color: var(--muted); }
.opt.selected .other-input::placeholder { color: rgba(255,255,255,0.7); }

/* scale */
.scale-wrap { margin-top: 20px; }
.scale-row { display: flex; gap: 8px; flex-wrap: wrap; }
.scale-btn {
  width: 52px; height: 52px; border-radius: var(--radius);
  border: 1.5px solid var(--border); background: var(--bg);
  font-size: 16px; font-weight: 500; cursor: pointer;
  transition: all .14s; color: var(--text); font-family: var(--font);
}
.scale-btn:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
.scale-btn.selected {
  background: var(--accent); color: var(--accent-inv);
  border-color: var(--accent);
}
.scale-labels {
  display: flex; justify-content: space-between;
  margin-top: 8px; font-size: 12px; color: var(--muted);
}
.scale-labels.ta { font-family: var(--tamil-font); font-size: 11px; }

/* textarea + single-line text input */
.q-textarea, .q-input {
  width: 100%; margin-top: 20px;
  padding: 14px 16px; border-radius: var(--radius);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 16px; /* 16px min prevents iOS auto-zoom on focus */
  font-family: var(--font); color: var(--text);
  line-height: 1.6; transition: border-color .14s;
}
.q-textarea { resize: none; min-height: 120px; }
.q-input { min-height: 52px; }
.q-textarea:focus, .q-input:focus { outline: none; border-color: var(--accent); }

/* pink dot accent on section label */
.sec-label::before {
  content: ''; display: inline-block;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); margin-right: 6px;
  vertical-align: middle; margin-top: -2px;
}

/* ── bottom bar ── */
#bottombar {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  /* extra bottom padding clears phone gesture-navigation bars */
  padding: 16px 24px calc(16px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
#btn-back {
  font-size: 14px; color: var(--muted); background: none;
  border: none; cursor: pointer; padding: 12px 8px; min-height: 44px;
  font-family: var(--font);
}
#btn-back:hover { color: var(--text); }
#btn-next {
  padding: 13px 28px; min-height: 44px; border-radius: var(--radius);
  background: var(--accent); color: var(--accent-inv);
  border: none; font-size: 15px; font-weight: 500;
  cursor: pointer; font-family: var(--font);
  transition: opacity .15s, transform .1s;
}
#btn-next:hover { opacity: .85; }
#btn-next:active { transform: scale(.98); }
#enter-hint {
  font-size: 11.5px; color: #bbb;
  position: fixed; bottom: 64px; right: 24px;
}

/* ── trap badge ── */
.trap-badge {
  display: inline-block; font-size: 10px; padding: 2px 8px;
  border-radius: 6px; background: #fff3e0; color: #b85c00;
  font-weight: 600; margin-bottom: 10px; letter-spacing: .04em;
}

/* ── welcome / thank-you slides ── */
.cover-title {
  font-size: clamp(26px, 5vw, 36px);
  font-weight: 700; line-height: 1.25; margin-bottom: 12px;
}
.cover-sub {
  font-size: 16px; color: var(--muted); line-height: 1.7;
  margin-bottom: 28px;
}
.cover-sub.ta { font-family: var(--tamil-font); }
.start-btn {
  padding: 15px 36px; border-radius: var(--radius);
  background: var(--accent); color: var(--accent-inv);
  border: none; font-size: 16px; font-weight: 500;
  cursor: pointer; font-family: var(--font);
  transition: opacity .15s;
}
.start-btn:hover { opacity: .85; }
.done-icon { font-size: 48px; margin-bottom: 16px; }

/* ── done-screen actions + status ── */
#done-status { font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
#done-actions { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 22px; }
.done-action-btn {
  padding: 12px 24px; min-height: 44px; border-radius: var(--radius);
  background: var(--accent); color: var(--accent-inv); border: none;
  font-size: 15px; font-weight: 500; cursor: pointer;
  font-family: var(--font); transition: opacity .15s;
}
.done-action-btn:hover { opacity: .85; }
.done-action-btn:disabled { opacity: .5; cursor: default; }
.done-action-btn.secondary {
  background: var(--bg); color: var(--accent); border: 1.5px solid var(--accent);
}

/* ── admin export panel (type "breezy" on the done screen) ── */
#admin-panel {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.admin-card {
  background: var(--bg); border-radius: var(--radius);
  width: 100%; max-width: 560px; max-height: 80vh; overflow: auto; padding: 20px;
}
.admin-title { font-size: 18px; font-weight: 600; margin-bottom: 14px; }
.admin-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.admin-pre {
  background: var(--surface); border-radius: 8px; padding: 12px;
  font-size: 11px; white-space: pre-wrap; word-break: break-word;
  color: var(--text); max-height: 40vh; overflow: auto;
}

/* ── error ── */
#err-msg {
  font-size: 13px; color: var(--danger);
  min-height: 18px; margin-top: 10px;
}

/* ── mobile tweaks ── */
@media (max-width: 480px) {
  #stage { padding: 64px 16px 76px; }
  .scale-btn { width: 46px; height: 46px; font-size: 14px; }
  #topbar { padding: 14px 16px 0; }
  #bottombar { padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .lang-btn { padding: 6px 12px; font-size: 12px; }
  #enter-hint { display: none; } /* no physical keyboard on phones */
}
</style>
</head>

<div id="progress-bar"></div>

<div id="topbar">
  <span id="q-counter"></span>
  <div id="lang-switcher">
    <button class="lang-btn active" onclick="setLang('en',this)">English</button>
    <button class="lang-btn" onclick="setLang('de',this)">Deutsch</button>
  </div>
</div>

<div id="stage"></div>

<div id="bottombar">
  <button id="btn-back" onclick="go(-1)">← Back</button>
  <div id="err-msg"></div>
  <button id="btn-next" onclick="next()">Next →</button>
</div>
<div id="enter-hint">Press Enter ↵</div>

<!-- Appwrite SDK -->
<script src="https://cdn.jsdelivr.net/npm/appwrite@17/dist/iife/sdk.js"></script>

<script>
/* ══════════════════════════════════════════════════════════════
   QUESTION DATA
   Each question: id, type (radio|check|scale|text),
   sec (section name — shown once at start of section),
   sketch (css class for sketch zone — shown on first Q of section),
   trap, q{en,ta,tg}, sub{en,ta,tg}, opts[], low{}, high{}
══════════════════════════════════════════════════════════════ */
/* Maps question id → sketch filename suffix (sketches/qNN-<suffix>.png) */
const SKETCH_MAP = {
  1:'consent', 2:'name', 3:'email', 4:'device',
  5:'android-version', 6:'language', 7:'frequency',
  8:'personality', 9:'api-key', 10:'willing-api',
  11:'phone-usage', 12:'study-interests',
  13:'feedback-channel', 14:'feedback-frequency',
  15:'whatsapp', 16:'uninstall', 17:'other-thoughts'
};

/* Single-line text questions that need a specific mobile keyboard / autofill.
   Anything not listed here renders as a multi-line <textarea>. */
const INPUT_ATTRS = {
  2:  { type:'text',  autocomplete:'name' },                       // name
  3:  { type:'email', inputmode:'email', autocomplete:'email' },   // email
  15: { type:'tel',   inputmode:'tel',   autocomplete:'tel' },     // WhatsApp number
};

const SLIDES = [

/* ── WELCOME ── */
{ id:'welcome', type:'welcome' },

/* ══ SECTION 1: INFORMED CONSENT ══ */
{ id:1, type:'radio',
  sec:{en:'Informed Consent', de:'Einwilligung'},
  q:{en:`<div class="consent-heading">By participating in this beta test, you acknowledge and agree to the following:</div>
<div class="consent-box"><ul class="consent-list">
<li>This app is a beta version and may contain bugs or unexpected behavior.</li>
<li>Your study topics and notification history are stored ONLY on your device. We never collect or access this data.</li>
<li>If you choose to provide an API key (Gemini, Groq, or OpenAI), it is encrypted with AES-256 on your device and never transmitted to our servers. However, your prompts will be sent to the API provider you selected — subject to THEIR privacy policy.</li>
<li>Location data (if granted) is used ONLY to fetch weather from Open-Meteo and is not stored or shared.</li>
<li>Your survey responses (name, email, device info, preferences) will be stored in Google Sheets and temporarily on your device for beta test coordination only. All data will be deleted after the test period ends.</li>
<li>The app sends AI-generated notifications. Despite our 3-layer safety filter, inappropriate content may occasionally appear. Please report any such instances.</li>
<li>You can uninstall the app and withdraw from the test at any time without explanation.</li>
<li>This is a university research project, not a commercial product. No warranties are provided.</li>
</ul></div>`,
     de:`<div class="consent-heading">Mit der Teilnahme an diesem Betatest bestätigst und akzeptierst du Folgendes:</div>
<div class="consent-box"><ul class="consent-list">
<li>Diese App ist eine Beta-Version und kann Fehler oder unerwartetes Verhalten aufweisen.</li>
<li>Deine Lernthemen und Benachrichtigungshistorie werden AUSSCHLIESSLICH auf deinem Gerät gespeichert. Wir erheben oder greifen nie auf diese Daten zu.</li>
<li>Wenn du einen API-Schlüssel (Gemini, Groq oder OpenAI) eingibst, wird er mit AES-256 auf deinem Gerät verschlüsselt und nie an unsere Server übertragen. Deine Anfragen werden jedoch an den gewählten API-Anbieter gesendet — deren Datenschutzrichtlinie gilt.</li>
<li>Standortdaten (falls erlaubt) werden NUR für die Wetterabfrage bei Open-Meteo verwendet und nicht gespeichert oder weitergegeben.</li>
<li>Deine Umfrageantworten (Name, E-Mail, Gerätedaten, Präferenzen) werden in Google Sheets und vorübergehend auf deinem Gerät für die Beta-Test-Koordination gespeichert. Alle Daten werden nach der Testphase gelöscht.</li>
<li>Die App sendet KI-generierte Benachrichtigungen. Trotz unseres 3-stufigen Sicherheitsfilters können vereinzelt unangemessene Inhalte erscheinen. Bitte melde solche Fälle.</li>
<li>Du kannst die App jederzeit deinstallieren und ohne Angabe von Gründen aus dem Test austreten.</li>
<li>Dies ist ein Universitäts-Forschungsprojekt, kein kommerzielles Produkt. Es werden keine Garantien übernommen.</li>
</ul></div>`},
  opts:[{en:'I agree and want to participate', de:'Ich stimme zu und möchte teilnehmen'},
        {en:'I do not agree',                  de:'Ich stimme nicht zu'}]},

/* ══ SECTION 2: ABOUT YOU ══ */
{ id:2, type:'text',
  sec:{en:'About You', de:'Über dich'},
  q:{en:'What is your name?',
     de:'Wie heißt du?'},
  sub:{en:'So we can reach you during the test phase.',
       de:'Damit wir dich während der Testphase erreichen können.'}},

{ id:3, type:'text',
  q:{en:'What is your email address?',
     de:'Wie lautet deine E-Mail-Adresse?'},
  sub:{en:'We will only use it for beta test communication.',
       de:'Wird nur für die Beta-Test-Kommunikation genutzt.'}},

/* ══ SECTION 3: DEVICE & SETUP ══ */
{ id:4, type:'radio',
  sec:{en:'Your Device', de:'Dein Gerät'},
  q:{en:'Which smartphone do you use?',
     de:'Welches Smartphone nutzt du?'},
  opts:[{en:'Android',       de:'Android'},
        {en:'iPhone (iOS)',   de:'iPhone (iOS)'},
        {en:'I use both',    de:'Ich nutze beides'}]},

{ id:5, type:'radio',
  q:{en:'Which Android version does your phone run? (Settings → About Phone)',
     de:'Welche Android-Version hat dein Handy? (Einstellungen → Über das Telefon)'},
  sub:{en:'Skip if you use iPhone only.',
       de:'Überspringe diese Frage, wenn du nur ein iPhone nutzt.'},
  opts:[{en:'Android 10 or older',  de:'Android 10 oder älter'},
        {en:'Android 11',           de:'Android 11'},
        {en:'Android 12',           de:'Android 12'},
        {en:'Android 13',           de:'Android 13'},
        {en:'Android 14 or newer',  de:'Android 14 oder neuer'},
        {en:'I don\'t know',        de:'Weiß ich nicht'},
        {en:'I use iPhone only',    de:'Ich nutze nur ein iPhone'}]},

/* ══ SECTION 4: NOTIFICATION PREFERENCES ══ */
{ id:6, type:'radio',
  sec:{en:'Notification Preferences', de:'Benachrichtigungs-Einstellungen'},
  q:{en:'In which language would you like to receive notifications?',
     de:'In welcher Sprache möchtest du Benachrichtigungen erhalten?'},
  opts:[{en:'English',              de:'Englisch'},
        {en:'German (Deutsch)',     de:'Deutsch'},
        {en:'Tamil (தமிழ்)',       de:'Tamil (தமிழ்)'},
        {en:'Tanglish (Tamil + English mix)', de:'Tanglish (Tamil + English Mix)'}]},

{ id:7, type:'radio',
  q:{en:'How often would you like to receive study notifications?',
     de:'Wie oft möchtest du Lern-Benachrichtigungen erhalten?'},
  opts:[{en:'Every 30 minutes',   de:'Alle 30 Minuten'},
        {en:'Every hour',         de:'Jede Stunde'},
        {en:'Every 2 hours',      de:'Alle 2 Stunden'},
        {en:'3-5 times per day',  de:'3-5 Mal pro Tag'},
        {en:'I want to decide myself', de:'Möchte ich selbst entscheiden'}]},

{ id:8, type:'radio',
  q:{en:'What personality style do you prefer for notifications?',
     de:'Welchen Benachrichtigungsstil bevorzugst du?'},
  opts:[{en:'Sarcastic & witty',           de:'Sarkastisch & witzig'},
        {en:'Friendly & encouraging',      de:'Freundlich & ermutigend'},
        {en:'Strict teacher / coach',      de:'Strenger Lehrer / Coach'},
        {en:'Motivational & inspiring',    de:'Motivierend & inspirierend'},
        {en:'Mix of everything (surprise me!)', de:'Mix aus allem (überrasch mich!)'}]},

/* ══ SECTION 5: TECHNICAL ══ */
{ id:9, type:'radio',
  sec:{en:'Technical Setup', de:'Technisches Setup'},
  q:{en:'Do you know what an API key is? (e.g., from OpenAI, Google Gemini, Groq)',
     de:'Weißt du, was ein API-Schlüssel ist? (z.B. von OpenAI, Google Gemini, Groq)'},
  opts:[{en:'Yes, I already have one',                de:'Ja, ich habe bereits einen'},
        {en:'Yes, but I don\'t have one yet',          de:'Ja, aber ich habe noch keinen'},
        {en:'I\'ve heard of it but don\'t know how it works', de:'Davon gehört, aber weiß nicht wie es funktioniert'},
        {en:'No, I have no idea what that is',         de:'Nein, davon habe ich keine Ahnung'}]},

{ id:10, type:'radio',
  q:{en:'Would you be willing to create a free API key (e.g., from Groq — takes 30 seconds) for better AI-generated notifications?',
     de:'Wärst du bereit, einen kostenlosen API-Schlüssel zu erstellen (z.B. bei Groq — dauert 30 Sekunden) für bessere KI-generierte Benachrichtigungen?'},
  opts:[{en:'Yes, happy to',                        de:'Ja, gerne'},
        {en:'Yes, if someone guides me through it', de:'Ja, wenn mir jemand dabei hilft'},

function renderSlide(s, idx) {
  const isDe = lang === 'de';
  const tclass = '';
  const tf = '';

  if (s.type === 'welcome') {

    };
    const anonNote = {
      en:'Your data is used only for the beta test · You can leave anytime · Contact: sas1924s@hs-coburg.de',

    };

    return `
    <div class="slide" id="slide-${idx}" style="overflow-y:auto;max-height:calc(100vh - 90px)">

          ${lang==='en' ? 'Device type · Language · Study interests<br>Feedback preferences · Notification style' : 'Gerätetyp · Sprache · Studieninteressen<br>Feedback-Präferenzen · Benachrichtigungsstil'}

  }

  if (s.type === 'declined') {
    return `
    <div class="slide" id="slide-${idx}" style="text-align:center">
      <img src="sketches/done-declined.png" alt=""
        style="width:100%;max-width:400px;margin:0 auto 20px;display:block;border-radius:8px"

        ? 'We totally respect that. BreezyBuddy will be here whenever you\'re ready — no pressure, no hard feelings.<br><br>Maybe the weather will bring you back someday. 🌤️'
        : 'Wir respektieren das vollkommen. BreezyBuddy ist hier, wann immer du bereit bist — kein Druck, alles gut.<br><br>Vielleicht bringt das Wetter dich eines Tages zurück. 🌤️'}</div>
    </div>`;
  }

  if (s.type === 'done') {
    return `
    <div class="slide" id="slide-${idx}" style="text-align:center">
      <img src="sketches/done-sunset.png"
        alt="" style="width:100%;max-width:500px;margin:0 auto 16px;display:block;border-radius:8px"
        onerror="this.style.display='none'">
      <div class="done-icon">🎉</div>
      <div class="cover-title">${lang==='en' ? 'You\'re all set!' : 'Alles bereit!'}</div>
      <div class="cover-sub">${lang==='en'
        ? 'Thank you! We\'ll reach out soon with your BreezyBuddy installation. In the meantime — maybe look out the window? The weather might have a surprise for you. 🌤️'
        : 'Danke! Wir melden uns bald bei dir für die BreezyBuddy-Installation. Schau in der Zwischenzeit vielleicht mal aus dem Fenster — das Wetter könnte eine Überraschung für dich haben. 🌤️'}</div>
      <div id="done-status"></div>
      <div id="done-actions"></div>
    </div>`;
  }

  // section label (must live INSIDE the slide, otherwise every section's
  // label renders in normal flow and they all overlap each other + the question)
  const sec = s.sec ? `<div class="sec-label">${s.sec[lang] || s.sec.en}</div>` : '';

  // question
  const qText = s.q[lang] || s.q.en;
  const subText = s.sub ? (s.sub[lang] || s.sub.en) : '';

  let html = `<div class="slide" id="slide-${idx}">`;
  html += sec;
  // comic-strip sketch above the question text
  if (SKETCH_MAP[s.id]) {
    html += `<img src="sketches/q${String(s.id).padStart(2,'0')}-${SKETCH_MAP[s.id]}.png"

      onerror="this.style.display='none'">`;
  }
  html += `<div class="q-text${tclass}">${qText}</div>`;
  if (subText) html += `<div style="font-size:13px;color:var(--muted);margin-bottom:14px">${subText}</div>`;

  // radio
  if (s.type === 'radio') {
    html += '<div class="opts opts-group">';
    s.opts.forEach((o, i) => {
      const label = o[lang] || o.en;
      html += `<button type="button" class="opt${answers[s.id]===i?' selected':''}" onclick="pickRadio(${s.id},${i},this)">
        <span class="opt-circle"></span><span class="opt-label">${label}</span>

    });
    if (s.hasOther) {
      html += `<label class="opt other-label${typeof answers[s.id]==='string'?' selected':''}">
        <span class="opt-circle"></span>
        <input type="text" class="other-input" placeholder="${lang==='en'?'Other...':'Sonstiges...'}"
          value="${typeof answers[s.id]==='string'?answers[s.id]:''}"
          oninput="pickOther(${s.id},this.value,this)"
          onfocus="pickOther(${s.id},this.value,this)">
      </label>`;
    }
    html += '</div>';
  }

  // check
  if (s.type === 'check') {
    html += '<div class="opts opts-group">';
    const sel = answers[s.id] || [];
    s.opts.forEach((o, i) => {
      const label = o[lang] || o.en;
      html += `<button type="button" class="opt${sel.includes(i)?' selected':''}" onclick="toggleCheck(${s.id},${i},this)">
        <span class="opt-sq"></span><span class="opt-label">${label}</span>
      </button>`;
    });
    if (s.hasOther) {
      html += `<label class="opt other-label${sel.includes('__other__')?' selected':''}">
        <span class="opt-sq"></span>
        <input type="text" class="other-input" placeholder="${lang==='en'?'Other...':'Sonstiges...'}"
          value="${answers[s.id+'_other']||''}"
          oninput="toggleOtherCheck(${s.id},this.value,this)"
          onfocus="toggleOtherCheck(${s.id},this.value,this)">
      </label>`;
    }
    html += '</div>';
  }

  // scale
  if (s.type === 'scale') {
    html += '<div class="scale-wrap"><div class="scale-row">';
    for (let i = 1; i <= 5; i++) {
      html += `<button type="button" class="scale-btn${answers[s.id]===i?' selected':''}" onclick="pickScale(${s.id},${i},this)">${i}</button>`;
    }
    html += '</div>';
    if (s.low || s.high) {
      html += `<div class="scale-labels"><span>${s.low?(s.low[lang]||s.low.en):''}</span><span>${s.high?(s.high[lang]||s.high.en):''}</span></div>`;
    }
    html += '</div>';
  }

  // text  (single-line <input> for name/email/phone so mobile shows the right
  //         keyboard + autofill; multi-line <textarea> for everything else)
  if (s.type === 'text') {
    const ph = lang==='en' ? 'Type here...' : 'Hier tippen...';
    const idRef = typeof s.id==='number' ? s.id : `'${s.id}'`;
    const a = INPUT_ATTRS[s.id];
    if (a) {
      const val = String(answers[s.id] || '').replace(/"/g,'&quot;');
      html += `<input class="q-input" type="${a.type}"
        ${a.inputmode ? `inputmode="${a.inputmode}"` : ''} ${a.autocomplete ? `autocomplete="${a.autocomplete}"` : ''}
        placeholder="${ph}" value="${val}"
        oninput="answers[${idRef}]=this.value">`;
    } else {
      html += `<textarea class="q-textarea" rows="3" placeholder="${ph}"
        oninput="answers[${idRef}]=this.value">${answers[s.id]||''}</textarea>`;
    }
  }

  html += '</div>';
  return html;
}

/* ══════════════════════════════════════════════════════════════
   INTERACTIONS
══════════════════════════════════════════════════════════════ */
function pickRadio(id, idx, el) {
  answers[id] = idx;
  el.closest('.opts-group').querySelectorAll('.opt').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  // auto-advance after short delay
  setTimeout(() => { if (answers[id] === idx) next(); }, 350);
}
function pickOther(id, val, el) {
  answers[id] = val;
  el.closest('.opts-group').querySelectorAll('.opt').forEach(d => d.classList.remove('selected'));
  el.closest('.opt').classList.add('selected');
}
function toggleCheck(id, idx, el) {
  if (!answers[id]) answers[id] = [];
  const arr = answers[id];
  const pos = arr.indexOf(idx);
  if (pos > -1) arr.splice(pos, 1); else arr.push(idx);
  el.classList.toggle('selected');
}
function toggleOtherCheck(id, val, el) {
  if (!answers[id]) answers[id] = [];
  answers[id+'_other'] = val;
  const arr = answers[id];
  if (!arr.includes('__other__')) arr.push('__other__');
  el.closest('.opt').classList.add('selected');
}
function pickScale(id, val, el) {
  answers[id] = val;
  el.closest('.scale-row').querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  setTimeout(() => { if (answers[id] === val) next(); }, 350);
}

/* ══════════════════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════════════════ */
function buildAll() {
  stage.innerHTML = SLIDES.map((s, i) => renderSlide(s, i)).join('');
  attachFocusScroll();
}

/* On mobile the on-screen keyboard covers the lower half of the screen.
   Scroll the focused field into the centre once the keyboard has opened. */
function attachFocusScroll() {
  document.querySelectorAll('.q-input, .q-textarea, .other-input').forEach(el => {
    el.addEventListener('focus', () => {
      setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
    });
  });
}

function showSlide(idx, dir) {
  const slides = stage.querySelectorAll('.slide');
  slides.forEach((sl, i) => {
    sl.classList.remove('active', 'exit-up', 'exit-down');
    if (i < idx) sl.classList.add('exit-up');
    if (i > idx) sl.classList.add('exit-down');
    if (i === idx) sl.classList.add('active');
  });
  // terminal (non-question) screens: welcome, declined, done
  const isTerminal = x => x.type === 'welcome' || x.type === 'done' || x.type === 'declined';
  // progress
  const total = SLIDES.filter(x => !isTerminal(x)).length;
  const done = Math.max(0, idx - 1);
  document.getElementById('progress-bar').style.transform = 'scaleX(' + (done / total) + ')';
  // counter
  const s = SLIDES[idx];
  document.getElementById('q-counter').textContent =
    isTerminal(s) ? '' : `${done} / ${total}`;
  // buttons
  document.getElementById('btn-back').style.visibility = idx > 0 && s.type !== 'done' && s.type !== 'declined' ? 'visible' : 'hidden';
  document.getElementById('btn-next').style.display = (s.type === 'done' || s.type === 'declined') ? 'none' : '';
  const isLast = idx === SLIDES.findIndex(x => x.type === 'declined') - 1;
  document.getElementById('btn-next').textContent =
    s.type === 'welcome' ? (lang==='en'?'Start →':'Start →') :
    isLast ? (lang==='en'?'Submit ✓':'Absenden ✓') :
    (lang==='en'?'Next →':'Weiter →');
}

function go(dir) {
  const newIdx = cur + dir;
  if (newIdx < 0 || newIdx >= SLIDES.length) return;
  cur = newIdx;
  showSlide(cur, dir);
}

function next() {
  const s = SLIDES[cur];
  const errEl = document.getElementById('err-msg');
  errEl.textContent = '';

  // validate required
  if (s.type === 'radio' && answers[s.id] === undefined) {
    errEl.textContent = lang==='en' ? 'Please select an option' : 'Bitte wähle eine Option';
    return;
  }
  if (s.type === 'text' && !s.optional && (!answers[s.id] || !answers[s.id].trim())) {
    errEl.textContent = lang==='en' ? 'Please enter a response' : 'Bitte gib eine Antwort ein';
    return;
  }
  if (s.id === 3) {
    const email = (answers[3] || '').trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      errEl.textContent = lang === 'en'
        ? 'Please enter a valid email address'
        : 'Bitte gib eine gültige E-Mail-Adresse ein';
      return;
    }
  }
  if (s.type === 'scale' && !answers[s.id]) {
    errEl.textContent = lang==='en' ? 'Please select a value' : 'Bitte wähle einen Wert';
    return;
  }

  // check consent — if user declined, show respectful goodbye (NO data submitted)
  if (s.id === 1 && answers[1] === 1) {
    cur = SLIDES.findIndex(x => x.type === 'declined');
    showSlide(cur, 1);
    return;
  }

  // last question — submit
  if (cur === SLIDES.findIndex(x => x.type === 'declined') - 1) {
    submitSurvey();
    return;
  }

  go(1);
}

function setLang(l, btn) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildAll();
  showSlide(cur, 0);
  // buildAll() wipes the done screen — repaint its status/buttons if we're there
  if (SLIDES[cur] && SLIDES[cur].type === 'done' && lastDoc) updateDoneScreen(lastSubmitOk);
}

// keyboard
document.addEventListener('keydown', e => {
  const onDone = SLIDES[cur] && SLIDES[cur].type === 'done';
  // Admin shortcut: type "breezy" on the done screen to open the export panel
  if (onDone && e.key.length === 1) {
    keyBuffer = (keyBuffer + e.key.toLowerCase()).slice(-6);
    if (keyBuffer === 'breezy') { keyBuffer = ''; showAdminPanel(); return; }
  }
  // Enter advances (but never inside a multi-line textarea, where it adds a newline)
  if (e.key === 'Enter' && !e.shiftKey && !(e.target && e.target.tagName === 'TEXTAREA')) {
    e.preventDefault(); next();
  }
});

/* ══════════════════════════════════════════════════════════════
   SUBMIT
══════════════════════════════════════════════════════════════ */
async function submitSurvey() {
  // Data collection order:
  // 1. Appwrite (primary — currently unconfigured)
  // 2. Google Sheets (active — fire-and-forget)
  // 3. localStorage + JSON download (always runs as backup)
  const secs = Math.round((Date.now() - startTime) / 1000);

  const doc = {
    consent:              optVal(1),
    name:                 answers[2] || '',
    email:                answers[3] || '',
    device:               optVal(4),
    android_version:      optVal(5),
    notification_lang:    optVal(6),
    notification_freq:    optVal(7),
    personality_style:    optVal(8),
    knows_api_key:        optVal(9),
    willing_api_key:      optVal(10),
    phone_usage_hours:    answers[11] || 0,
    study_interests:      arrVal(12),
    feedback_channel:     optVal(13),
    feedback_frequency:   optVal(14),
    whatsapp_number:      answers[15] || '',
    uninstall_reason:     answers[16] || '',
    other_thoughts:       answers[17] || '',
    survey_lang:          lang,
    duration_secs:        secs,
    submitted_at:         new Date().toISOString(),
  };
  lastDoc = doc;

  // ── Primary: Appwrite ──────────────────────────────────────────────
  const onlineOk = await sendToAppwrite(doc);

  // ── Google Sheets (fire-and-forget; no-cors = opaque response) ──────
  // Apps Script web app behind this URL appends each response as a row.
  // Setup is documented in CLAUDE.md / git history (doPost handler).
  const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbyHhCAsZs0dV3fIL8b6notIb_THBW9dsEFd6SKUV8HGpwmutCtZ_6lqx_82ag8CPAfr/exec';
  try {
    await fetch(SHEETS_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(doc)
    });
  } catch (err) {
    console.error('Sheets error:', err);
  }

  // ── Fallback: generate downloadable JSON ────────────────────────────
  const blob = new Blob([JSON.stringify(doc, null, 2)],
    {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const downloadLinkEl = document.createElement('a');
  downloadLinkEl.href = url;
  downloadLinkEl.download = `breezybuddy-tester-${(doc.name||'tester').replace(/\s+/g,'-')}-${Date.now()}.json`;
  downloadLinkEl.style.display = 'none';
  document.body.appendChild(downloadLinkEl);
  downloadLink = downloadLinkEl;   // remembered so the done-screen button can trigger it

  // Store in localStorage as backup
  const stored = JSON.parse(localStorage.getItem('bb_responses') || '[]');
  stored.push(doc);
  localStorage.setItem('bb_responses', JSON.stringify(stored));

  lastSubmitOk = onlineOk;
  cur = SLIDES.length - 1;
  showSlide(cur, 1);
  updateDoneScreen(onlineOk);
}

/* Returns true on a successful Appwrite write, false otherwise.
   Skips the network call entirely while the config still holds placeholders. */
async function sendToAppwrite(doc) {
  if (!AW_PROJECT_ID || AW_PROJECT_ID.startsWith('PASTE_')) return false;
  try {
    const { Client, Databases, ID } = Appwrite;
    const client = new Client()
      .setEndpoint(AW_ENDPOINT)
      .setProject(AW_PROJECT_ID);
    const db = new Databases(client);
    await db.createDocument(AW_DATABASE_ID, AW_COLLECTION, ID.unique(), doc);
    return true;
  } catch (err) {
    console.error('Appwrite error:', err);
    return false;
  }
}

/* Paints the status line + action buttons on the done screen. */
function updateDoneScreen(onlineOk) {
  const status  = document.getElementById('done-status');
  const actions = document.getElementById('done-actions');
  if (!status || !actions) return;
  const configured = AW_PROJECT_ID && !AW_PROJECT_ID.startsWith('PASTE_');

  if (onlineOk) {
    status.textContent = lang==='en'
      ? 'Your response was submitted successfully. ✓'
      : 'Deine Antwort wurde erfolgreich übermittelt. ✓';
  } else if (configured) {
    // Appwrite is set up but the network call failed → offline
    status.textContent = lang==='en'
      ? '💾 Response saved locally. It will be submitted when you\'re back online.'
      : '💾 Antwort lokal gespeichert. Sie wird übermittelt, sobald du wieder online bist.';
  } else {
    // No backend configured yet → the download/export is the real collection path
    status.textContent = lang==='en'
      ? '💾 Response saved on this device. Use the button below to download it.'
      : '💾 Antwort auf diesem Gerät gespeichert. Lade sie über die Schaltfläche unten herunter.';
  }

  actions.innerHTML = '';
  // Always offer the JSON download
  const dl = document.createElement('button');
  dl.className = 'done-action-btn';
  dl.textContent = lang==='en' ? 'Download my response' : 'Meine Antwort herunterladen';
  dl.onclick = () => { if (downloadLink) downloadLink.click(); };
  actions.appendChild(dl);

  // Offer a retry only when a real backend is configured but the send failed
  if (!onlineOk && configured) {
    const retry = document.createElement('button');
    retry.className = 'done-action-btn secondary';
    retry.textContent = lang==='en' ? 'Retry submission' : 'Erneut versuchen';
    retry.onclick = () => retrySubmit(retry);
    actions.appendChild(retry);
  }
}

async function retrySubmit(btn) {
  if (!lastDoc) return;
  btn.disabled = true;
  btn.textContent = lang==='en' ? 'Submitting…' : 'Wird gesendet…';
  const ok = await sendToAppwrite(lastDoc);
  lastSubmitOk = ok;
  if (ok) updateDoneScreen(true);
  else {
    btn.disabled = false;
    btn.textContent = lang==='en' ? 'Still offline — retry' : 'Noch offline — erneut versuchen';
  }
}

/* ══════════════════════════════════════════════════════════════
   ADMIN EXPORT  —  type "breezy" on the done screen
══════════════════════════════════════════════════════════════ */
function showAdminPanel() {
  const rows = JSON.parse(localStorage.getItem('bb_responses') || '[]');
  const existing = document.getElementById('admin-panel');
  if (existing) existing.remove();

  const panel = document.createElement('div');
  panel.id = 'admin-panel';
  panel.innerHTML = `
    <div class="admin-card">
      <div class="admin-title">📊 Stored responses on this device: ${rows.length}</div>
      <div class="admin-actions">
        <button class="done-action-btn" id="admin-csv">Download CSV</button>
        <button class="done-action-btn" id="admin-json">Download JSON</button>
        <button class="done-action-btn secondary" id="admin-close">Close</button>
      </div>
      <pre class="admin-pre">${rows.length ? escapeHtml(JSON.stringify(rows, null, 2)).slice(0, 6000) : 'No responses stored on this device yet.'}</pre>
    </div>`;
  document.body.appendChild(panel);

  panel.addEventListener('click', e => { if (e.target === panel) panel.remove(); });
  document.getElementById('admin-close').onclick = () => panel.remove();
  document.getElementById('admin-csv').onclick = () =>
    downloadBlob(responsesToCSV(rows), `breezybuddy-responses-${Date.now()}.csv`, 'text/csv');
  document.getElementById('admin-json').onclick = () =>
    downloadBlob(JSON.stringify(rows, null, 2), `breezybuddy-responses-${Date.now()}.json`, 'application/json');
}

/* Flattens all stored responses to CSV (union of keys, RFC-4180 quoting). */
function responsesToCSV(rows) {
  if (!rows.length) return '';
  const keys = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
  const esc = v => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [keys.join(',')];
  rows.forEach(r => lines.push(keys.map(k => esc(r[k])).join(',')));
  return lines.join('\n');
}

function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
}

function optVal(id) {
  const s = SLIDES.find(x => x.id === id);
  const ans = answers[id];
  if (!s || ans === undefined) return '';
  return s.opts && s.opts[ans] ? s.opts[ans].en : String(ans);
}
function arrVal(id) {
  const s = SLIDES.find(x => x.id === id);
  const ans = answers[id];
  if (!s || !ans || !ans.length) return '';
  return ans.map(i => s.opts[i]?.en || i).join(', ');
}
